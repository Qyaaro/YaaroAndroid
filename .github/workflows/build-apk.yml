name: Build Yaaro APK

on:
  push:
    branches: [ main, master, feature/native-background-call-answer ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Remove local.properties (CI conflict)
        run: rm -f local.properties

      - name: Ensure Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fSL --retry 3 -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          unzip -t gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - name: Verify native call session state machine
        run: |
          mkdir -p /tmp/yaaro-call-smoke
          javac -d /tmp/yaaro-call-smoke \
            app/src/main/java/com/yaaro/app/NativeCallSession.java \
            ci/NativeCallSessionSmokeTest.java
          java -cp /tmp/yaaro-call-smoke com.yaaro.app.NativeCallSessionSmokeTest

      - name: Build debug + release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaaro-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Yaaro-app-release
          path: app/build/outputs/apk/release/app-release.apk
