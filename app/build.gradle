plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.yaaro.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yaaro.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.0"
    }

    // Release signing credentials come only from CI environment or local environment.
    // No signing key or password should be committed to this repository.
    def signingPath = System.getenv("QYAARO_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("QYAARO_KEYSTORE_PASSWORD")
    def signingAlias = System.getenv("QYAARO_KEY_ALIAS")
    def signingKeyPassword = System.getenv("QYAARO_KEY_PASSWORD")
    def releaseSigningReady = [signingPath, signingStorePassword, signingAlias, signingKeyPassword].every { it != null && !it.isEmpty() }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(signingPath)
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'com.google.android.material:material:1.11.0'

    // Firebase + FCM
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
